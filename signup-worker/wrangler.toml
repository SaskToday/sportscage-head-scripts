name = "sasktoday-signup"
main = "src/index.ts"
compatibility_date = "2026-10-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

# Create with: wrangler kv namespace create SIGNUP_STATE
# Then paste the id below (staging and production can share or use separate namespaces).
[[kv_namespaces]]
binding = "SIGNUP_STATE"
id = "e6526283548240a9ae0a7fa50b952f09"
preview_id = "faf92aef68f14d24ad4aa9af93f954fe"

[vars]
# Datacenter suffix from the Mailchimp API key (e.g. key-us18 → us18)
MAILCHIMP_DC = "us18"
# Comma-separated exact origins allowed to call POST /subscribe
ALLOWED_ORIGINS = "https://www.sasktoday.ca,https://sasktoday.ca,http://127.0.0.1:8765,http://localhost:8765"
# Comma-separated hostnames allowed on Turnstile siteverify responses
TURNSTILE_ALLOWED_HOSTNAMES = "www.sasktoday.ca,sasktoday.ca,127.0.0.1,localhost"
BODY_MAX_BYTES = "2048"
# Email: room for all path-based newsletter widgets + a couple retries
EMAIL_MAX_PER_HOUR = "10"
# IP: a bit above email so shared Wi‑Fi / office NAT isn't the first limiter
IP_MAX_PER_HOUR = "20"
BREAKER_MAX_SIGNUPS_PER_HOUR = "100"
BREAKER_MAX_MAILCHIMP_ERRORS_PER_5MIN = "20"
BREAKER_COOLDOWN_SECONDS = "3600"
TURNSTILE_FAIL_ALERT_PER_10MIN = "200"
TURNSTILE_FAIL_MAX_PER_IP_10MIN = "5"
TURNSTILE_FAIL_BLOCK_SECONDS = "600"

# Daily disposable digest → Teams (previous America/Edmonton calendar day).
# 06:10 UTC ≈ 00:10 MDT / 23:10 MST — close to local end-of-day.
[triggers]
crons = ["10 6 * * *"]

# Hosts sasktoday-newsletter-inject.js at the Worker URL (synced from repo root on deploy).
[assets]
directory = "./public"
binding = "ASSETS"
# API routes always hit the Worker; static JS is served from assets.
run_worker_first = ["/subscribe", "/ops/*"]

[observability]
enabled = true

[observability.logs]
enabled = true

# Secrets (set via `wrangler secret put`, never commit):
#   MAILCHIMP_API_KEY
#   TURNSTILE_SECRET
#   ALERT_WEBHOOK_URL     — breaker / config / Turnstile wave (ops channel)
#   DIGEST_WEBHOOK_URL    — daily disposable % digest (separate chat/channel)
